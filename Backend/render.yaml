services:
  - type: web
    name: muscle-forge-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: database
    name: muscle-forge-db
    plan: free
    region: oregon
    databaseName: muscleforge
    user: muscleforge_user
