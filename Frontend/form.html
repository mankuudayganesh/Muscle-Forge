<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Forge - Your Details</title>
    <meta name="description" content="Tell us about yourself to get a personalized transformation blueprint">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; overflow-x: hidden; color: white; min-height: 100vh; opacity: 0; transition: opacity 0.6s ease; }
        body.loaded { opacity: 1; }
        
        .gym-bg { position: fixed; inset: 0; z-index: 0; background: url('https://images.unsplash.com/photo-1571902943202-507ec2618e8f?w=1920&q=80') center/cover no-repeat; background-attachment: fixed; }
        .gym-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,0.92) 0%, rgba(30,0,0,0.85) 50%, rgba(0,0,0,0.92) 100%); }
        
        canvas#bgCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .content { position: relative; z-index: 2; opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .content.visible { opacity: 1; transform: translateY(0); }
        
        .navbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1300px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px) saturate(200%); border-radius: 60px; padding: 14px 35px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border: 1px solid rgba(255,0,0,0.4); }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; font-family: 'Orbitron', sans-serif; text-decoration: none; color: white; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #ff0000, #cc0000); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 15px rgba(255,0,0,0.4); }
        .logo-text { background: linear-gradient(135deg, #fff, #ff0000, #cc0000); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .back-btn { display: flex; align-items: center; gap: 8px; padding: 10px 24px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,0,0,0.4); border-radius: 50px; color: white; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.4s; }
        .back-btn:hover { background: rgba(255,0,0,0.15); border-color: #ff0000; }
        
        .form-container { max-width: 720px; margin: 0 auto; padding: 130px 20px 80px; }
        .form-header { text-align: center; margin-bottom: 45px; }
        .form-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 20px; background: rgba(255,0,0,0.15); border: 1px solid rgba(255,0,0,0.4); border-radius: 50px; font-size: 12px; font-weight: 700; color: #ff0000; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; }
        .form-header h1 { font-family: 'Orbitron', sans-serif; font-size: 42px; font-weight: 900; margin-bottom: 12px; }
        .gradient-text { background: linear-gradient(135deg, #ff0000, #cc0000); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .form-header p { font-size: 16px; opacity: 0.6; font-family: 'Rajdhani', sans-serif; }
        
        .progress-bar { display: flex; align-items: center; justify-content: center; margin-bottom: 45px; }
        .step-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; position: relative; }
        .step-circle.active { background: linear-gradient(135deg, #ff0000, #cc0000); box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        .step-circle.completed { background: linear-gradient(135deg, #00ff88, #00cc66); }
        .step-circle.inactive { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.4); }
        .step-line { width: 70px; height: 2px; background: rgba(255,255,255,0.1); }
        .step-line.active { background: linear-gradient(90deg, #ff0000, #cc0000); }
        .step-label { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; font-weight: 600; }
        
        .form-card { background: rgba(0,0,0,0.6); backdrop-filter: blur(25px); border-radius: 28px; border: 1px solid rgba(255,0,0,0.15); padding: 45px; }
        
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: rgba(255,255,255,0.8); text-transform: uppercase; font-family: 'Orbitron', sans-serif; }
        .form-group label .required { color: #ff0000; }
        
        .form-group input, .form-group select { width: 100%; padding: 15px 16px; background: rgba(0,0,0,0.5); border: 1.5px solid rgba(255,0,0,0.2); border-radius: 14px; color: white; font-size: 15px; font-family: 'Inter', sans-serif; transition: all 0.4s; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #ff0000; background: rgba(255,0,0,0.08); }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        
        .goal-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .goal-option { padding: 15px; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,0,0,0.15); border-radius: 14px; cursor: pointer; text-align: center; }
        .goal-option.selected { border-color: #ff0000; background: rgba(255,0,0,0.12); }
        .goal-option .goal-icon { font-size: 26px; margin-bottom: 6px; }
        .goal-option .goal-label { font-size: 12px; font-weight: 700; }
        .goal-option input[type="radio"] { display: none; }
        
        .activity-options { display: flex; flex-direction: column; gap: 8px; }
        .activity-option { padding: 14px 18px; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,0,0,0.15); border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 14px; }
        .activity-option.selected { border-color: #ff0000; background: rgba(255,0,0,0.12); }
        .activity-option .activity-icon { font-size: 22px; width: 40px; text-align: center; }
        .activity-option .activity-info h4 { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
        .activity-option .activity-info p { font-size: 11px; opacity: 0.5; }
        .activity-option input[type="radio"] { display: none; }
        
        .submit-btn { width: 100%; padding: 17px; background: linear-gradient(135deg, #ff0000, #cc0000); border: none; border-radius: 14px; color: white; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.4s; margin-top: 8px; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(255,0,0,0.5); }
        
        .security-note { text-align: center; margin-top: 22px; opacity: 0.4; font-size: 12px; }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); z-index: 10000; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .loading-spinner { width: 60px; height: 60px; border: 4px solid rgba(255,0,0,0.2); border-top: 4px solid #ff0000; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .footer { background: #000000; padding: 30px 20px; text-align: center; border-top: 1px solid rgba(255,0,0,0.2); margin-top: 40px; }
        
        @media (max-width: 768px) { .form-card { padding: 28px 18px; } .form-header h1 { font-size: 28px; } .form-row { grid-template-columns: 1fr; } }
        ::selection { background: rgba(255,0,0,0.4); color: white; }
    </style>
</head>
<body>
    <div class="gym-bg"></div>
    <canvas id="bgCanvas"></canvas>
    
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">GENERATING YOUR PLAN...</div>
    </div>
    
    <div class="content" id="mainContent">
        <nav class="navbar">
            <a href="index.html" class="logo"><div class="logo-icon">⚡</div><span class="logo-text">MUSCLE FORGE</span></a>
            <a href="gender.html" class="back-btn">← Back</a>
        </nav>
        
        <div class="form-container">
            <div class="form-header">
                <div class="form-badge">STEP 2 OF 3</div>
                <h1>Tell Us About <span class="gradient-text">You</span></h1>
                <p>We'll create your personalized transformation blueprint</p>
            </div>
            
            <div class="progress-bar">
                <div class="step-circle completed">✓<span class="step-label">Gender</span></div>
                <div class="step-line active"></div>
                <div class="step-circle active">2<span class="step-label">Details</span></div>
                <div class="step-line"></div>
                <div class="step-circle inactive">3<span class="step-label">Plan</span></div>
            </div>
            
            <div class="form-card">
                <form id="fitnessForm">
                    <div class="form-group"><label>Full Name <span class="required">*</span></label><input type="text" id="fullName" placeholder="Enter your full name" required></div>
                    <div class="form-row">
                        <div class="form-group"><label>Age <span class="required">*</span></label><input type="number" id="age" placeholder="Your age" min="14" max="100" required></div>
                        <div class="form-group"><label>Weight (KG) <span class="required">*</span></label><input type="number" id="weight" placeholder="In kilograms" min="30" max="250" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Height (CM) <span class="required">*</span></label><input type="number" id="height" placeholder="In centimeters" min="100" max="250" required></div>
                        <div class="form-group"><label>Weekly Budget (₹) <span class="required">*</span></label><input type="number" id="budget" placeholder="Enter your weekly food budget" min="500" max="50000" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Experience Level</label><select id="experience"><option value="beginner">Beginner (0-6 months)</option><option value="intermediate" selected>Intermediate (6-24 months)</option><option value="advanced">Advanced (2+ years)</option></select></div>
                        <div class="form-group"><label>Diet Preference</label><select id="diet_preference"><option value="veg">Vegetarian</option><option value="nonveg" selected>Non-Vegetarian</option></select></div>
                    </div>
                    <div class="form-group"><label>Workout Location</label><select id="workout_location"><option value="gym" selected>Gym</option><option value="home">Home</option></select></div>
                    
                    <div class="form-group"><label>Fitness Goal <span class="required">*</span></label>
                        <div class="goal-options">
                            <label class="goal-option" onclick="selectGoal(this)"><input type="radio" name="goal" value="muscle_gain"><div class="goal-icon">💪</div><div class="goal-label">Muscle Gain</div></label>
                            <label class="goal-option" onclick="selectGoal(this)"><input type="radio" name="goal" value="fat_loss"><div class="goal-icon">🔥</div><div class="goal-label">Fat Loss</div></label>
                            <label class="goal-option" onclick="selectGoal(this)"><input type="radio" name="goal" value="lean_body"><div class="goal-icon">🎯</div><div class="goal-label">Lean Body</div></label>
                            <label class="goal-option" onclick="selectGoal(this)"><input type="radio" name="goal" value="maintenance"><div class="goal-icon">⚡</div><div class="goal-label">Maintenance</div></label>
                        </div>
                    </div>
                    
                    <div class="form-group"><label>Activity Level <span class="required">*</span></label>
                        <div class="activity-options">
                            <label class="activity-option" onclick="selectActivity(this)"><input type="radio" name="activity" value="sedentary"><span class="activity-icon">🪑</span><div class="activity-info"><h4>Sedentary</h4><p>Little or no exercise</p></div></label>
                            <label class="activity-option" onclick="selectActivity(this)"><input type="radio" name="activity" value="light"><span class="activity-icon">🚶</span><div class="activity-info"><h4>Lightly Active</h4><p>Light exercise 1-3 days/week</p></div></label>
                            <label class="activity-option" onclick="selectActivity(this)"><input type="radio" name="activity" value="moderate" checked><span class="activity-icon">🏃</span><div class="activity-info"><h4>Moderately Active</h4><p>Moderate exercise 3-5 days/week</p></div></label>
                            <label class="activity-option" onclick="selectActivity(this)"><input type="radio" name="activity" value="very_active"><span class="activity-icon">🏋️</span><div class="activity-info"><h4>Very Active</h4><p>Hard exercise 6-7 days/week</p></div></label>
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn">Generate My Plan →</button>
                </form>
            </div>
            <div class="security-note"><p>🔒 Your information is encrypted and secure</p></div>
        </div>
    </div>
    
    <footer class="footer"><p>© 2024 Muscle Forge — Forging Champions Worldwide 🌍</p></footer>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ========== BACKEND CONFIGURATION - CHANGE THIS TO YOUR RENDER URL ==========
        const API_BASE_URL = 'https://muscle-forge.onrender.com/api';
        
        function selectGoal(el) { document.querySelectorAll('.goal-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); const radio = el.querySelector('input[type="radio"]'); if (radio) radio.checked = true; }
        function selectActivity(el) { document.querySelectorAll('.activity-option').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); const radio = el.querySelector('input[type="radio"]'); if (radio) radio.checked = true; }
        
        document.getElementById('fitnessForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'flex';
            
            const formData = {
                name: document.getElementById('fullName').value,
                gender: localStorage.getItem('selectedGender') || 'male',
                age: parseInt(document.getElementById('age').value),
                height: parseFloat(document.getElementById('height').value),
                weight: parseFloat(document.getElementById('weight').value),
                budget: parseFloat(document.getElementById('budget').value),
                experience: document.getElementById('experience').value,
                goal: document.querySelector('input[name="goal"]:checked').value,
                diet_preference: document.getElementById('diet_preference').value,
                workout_location: document.getElementById('workout_location').value,
                activity_level: document.querySelector('input[name="activity"]:checked').value
            };
            
            try {
                console.log('Sending to:', `${API_BASE_URL}/generate-plan`);
                const response = await fetch(`${API_BASE_URL}/generate-plan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const planData = await response.json();
                localStorage.setItem('userPlan', JSON.stringify({ success: true, ...planData }));
                window.location.href = 'plan.html';
            } catch (error) {
                alert('❌ Failed to generate plan!\n\nMake sure backend is running at: ' + API_BASE_URL);
                loadingOverlay.style.display = 'none';
            }
        });
        
        // Set default selections
        document.querySelector('.goal-option input[value="muscle_gain"]').closest('.goal-option').classList.add('selected');
        document.querySelector('.activity-option input[value="moderate"]').closest('.activity-option').classList.add('selected');
        
        // Three.js background
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 20;
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bgCanvas'), alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        scene.add(new THREE.AmbientLight(0x0a0a0a, 0.4));
        const light = new THREE.PointLight(0xff0000, 1, 50);
        light.position.set(-8, 5, 5);
        scene.add(light);
        const torusKnot = new THREE.Mesh(new THREE.TorusKnotGeometry(2.5, 0.35, 256, 32, 3, 5), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x330000 }));
        scene.add(torusKnot);
        const particles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xff0000, size: 0.05 }));
        const positions = new Float32Array(2000 * 3);
        for(let i=0; i<2000; i++) { positions[i*3]=(Math.random()-0.5)*200; positions[i*3+1]=(Math.random()-0.5)*100; positions[i*3+2]=(Math.random()-0.5)*100-30; }
        particles.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        scene.add(particles);
        let time = 0;
        function animate() { requestAnimationFrame(animate); time += 0.01; torusKnot.rotation.x = time * 0.3; torusKnot.rotation.y = time * 0.2; particles.rotation.y = time * 0.02; renderer.render(scene, camera); }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        
        document.body.classList.add('loaded');
        setTimeout(() => document.getElementById('mainContent').classList.add('visible'), 100);
    </script>
</body>
</html>
