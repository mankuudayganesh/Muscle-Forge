<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Muscle Forge</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; overflow-x: hidden; color: white; min-height: 100vh; opacity: 0; transition: opacity 0.6s ease; }
        body.loaded { opacity: 1; }
        
        .gym-bg { position: fixed; inset: 0; z-index: 0; background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1920&q=80') center/cover no-repeat; background-attachment: fixed; }
        .gym-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,0,0,0.92) 0%, rgba(30,0,0,0.85) 50%, rgba(0,0,0,0.92) 100%); }
        
        canvas#bgCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .content { position: relative; z-index: 2; opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease, transform 0.8s ease; }
        .content.visible { opacity: 1; transform: translateY(0); }
        
        .navbar { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1300px; background: rgba(0,0,0,0.95); backdrop-filter: blur(25px); border-radius: 60px; padding: 14px 35px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border: 1px solid rgba(255,0,0,0.4); }
        .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; font-family: 'Orbitron', sans-serif; text-decoration: none; color: white; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #ff0000, #cc0000); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 4px 15px rgba(255,0,0,0.4); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 4px 15px rgba(255,0,0,0.4); } 50% { box-shadow: 0 4px 25px rgba(255,0,0,0.8); } }
        .logo-text { background: linear-gradient(135deg, #fff, #ff0000, #cc0000); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .back-btn { padding: 10px 24px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,0,0,0.4); border-radius: 50px; color: white; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.4s; }
        .back-btn:hover { background: rgba(255,0,0,0.15); border-color: #ff0000; }
        
        .signup-container { max-width: 500px; margin: 0 auto; padding: 130px 20px 80px; }
        .signup-card { background: rgba(0,0,0,0.7); backdrop-filter: blur(25px); border-radius: 30px; border: 1px solid rgba(255,0,0,0.3); padding: 45px; }
        .signup-header { text-align: center; margin-bottom: 35px; }
        .signup-header h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; margin-bottom: 10px; }
        .gradient-text { background: linear-gradient(135deg, #ff0000, #cc0000); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .signup-header p { color: rgba(255,255,255,0.6); font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: rgba(255,255,255,0.8); }
        .form-group input, .form-group select { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,0,0,0.3); border-radius: 12px; color: white; font-size: 16px; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #ff0000; background: rgba(255,0,0,0.05); }
        
        .btn-signup { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff0000, #cc0000); border: none; border-radius: 50px; color: white; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; }
        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,0,0,0.4); }
        
        .divider { text-align: center; position: relative; margin: 20px 0; color: rgba(255,255,255,0.4); }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 45%; height: 1px; background: rgba(255,255,255,0.1); }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        
        .login-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); }
        .login-link a { color: #ff0000; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .alert-error { background: rgba(255,0,0,0.2); border: 1px solid #ff0000; color: #ff6666; }
        .alert-success { background: rgba(0,255,0,0.1); border: 1px solid #00ff00; color: #00ff88; }
        .alert-info { background: rgba(0,170,255,0.1); border: 1px solid #00aaff; color: #66ccff; }
        
        .terms { font-size: 12px; text-align: center; margin-top: 20px; color: rgba(255,255,255,0.4); }
        .terms a { color: #ff0000; text-decoration: none; }
        
        .footer { background: #000000; padding: 30px 20px; text-align: center; border-top: 1px solid rgba(255,0,0,0.2); margin-top: 40px; }
        
        @media (max-width: 768px) { .signup-card { padding: 30px 20px; } .signup-header h1 { font-size: 28px; } }
        ::selection { background: rgba(255,0,0,0.4); color: white; }
    </style>
</head>
<body>
    <div class="gym-bg"></div>
    <canvas id="bgCanvas"></canvas>
    
    <div class="content" id="mainContent">
        <nav class="navbar">
            <a href="index.html" class="logo"><div class="logo-icon">⚡</div><span class="logo-text">MUSCLE FORGE</span></a>
            <a href="index.html" class="back-btn">← Back to Home</a>
        </nav>
        
        <div class="signup-container">
            <div class="signup-card">
                <div class="signup-header">
                    <h1>Create <span class="gradient-text">Account</span></h1>
                    <p>Join Muscle Forge and start your transformation journey</p>
                </div>
                
                <div id="alert" class="alert"></div>
                
                <form id="signupForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" placeholder="Create a password (min 6 characters)" required>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Fitness Goal</label>
                        <select id="signupGoal" required>
                            <option value="">Select your goal</option>
                            <option value="muscle_gain">💪 Muscle Gain</option>
                            <option value="fat_loss">🔥 Fat Loss</option>
                            <option value="lean_body">🎯 Lean Body</option>
                            <option value="maintenance">⚡ Maintenance</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Weekly Budget (₹)</label>
                        <select id="signupBudget" required>
                            <option value="">Select your budget</option>
                            <option value="1000">₹1000 (Basic)</option>
                            <option value="1500">₹1500 (Standard)</option>
                            <option value="2000">₹2000 (Premium)</option>
                            <option value="2500">₹2500 (Elite)</option>
                            <option value="3000">₹3000 (Luxury)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Diet Preference</label>
                        <select id="signupDiet" required>
                            <option value="">Select diet preference</option>
                            <option value="veg">🥗 Vegetarian</option>
                            <option value="nonveg">🍗 Non-Vegetarian</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-signup">Create Account →</button>
                </form>
                
                <div class="divider">OR</div>
                
                <button class="btn-signup" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,0,0,0.4);" id="googleSignupBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" style="display: inline; margin-right: 10px;">
                        <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#ffffff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#ffffff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign up with Google
                </button>
                
                <div class="login-link">
                    Already have an account? <a href="login.html">Login</a>
                </div>
                
                <div class="terms">
                    By signing up, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>
                </div>
            </div>
        </div>
        
        <footer class="footer"><p>© 2024 Muscle Forge — Forging Champions Worldwide 🌍</p></footer>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import { auth, db, createUserWithEmailAndPassword, signInWithPopup, googleProvider, doc, setDoc, onAuthStateChanged } from './firebase-config.js';
        
        function showAlert(message, type) {
            let alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => { alertDiv.style.display = 'none'; }, 4000);
        }
        
        async function saveUserToFirestore(user, userData) {
            try {
                await setDoc(doc(db, "users", user.uid), {
                    name: userData.name,
                    email: user.email,
                    goal: userData.goal,
                    budget: parseInt(userData.budget),
                    dietPreference: userData.dietPreference,
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString(),
                    plansGenerated: 0,
                    feedbacks: [],
                    totalPoints: 0,
                    completedDays: []
                });
                console.log("User saved to Firestore successfully");
                return true;
            } catch (error) {
                console.error("Error saving user to Firestore:", error);
                return false;
            }
        }
        
        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const goal = document.getElementById('signupGoal').value;
            const budget = document.getElementById('signupBudget').value;
            const dietPreference = document.getElementById('signupDiet').value;
            
            if (!name || !email || !password) {
                showAlert('Please fill in all fields', 'error');
                return;
            }
            if (!goal) {
                showAlert('Please select your fitness goal', 'error');
                return;
            }
            if (!budget) {
                showAlert('Please select your weekly budget', 'error');
                return;
            }
            if (!dietPreference) {
                showAlert('Please select your diet preference', 'error');
                return;
            }
            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }
            if (!email.includes('@')) {
                showAlert('Please enter a valid email address', 'error');
                return;
            }
            
            showAlert('Creating account...', 'info');
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Save to Firestore
                await saveUserToFirestore(user, { name, goal, budget, dietPreference });
                
                // Store user in localStorage for homepage
                localStorage.setItem('firebaseUser', JSON.stringify({ 
                    email: user.email, 
                    uid: user.uid,
                    name: name
                }));
                
                // Store in localStorage for quick access
                localStorage.setItem('userGoal', goal);
                localStorage.setItem('userBudget', budget);
                localStorage.setItem('userDiet', dietPreference);
                
                showAlert('Account created successfully! Redirecting...', 'success');
                
                // Check for redirect after login
                const redirectUrl = localStorage.getItem('redirectAfterLogin');
                if (redirectUrl) {
                    localStorage.removeItem('redirectAfterLogin');
                    setTimeout(() => { window.location.href = redirectUrl; }, 1500);
                } else {
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                }
            } catch (error) {
                console.error('Signup error:', error.code, error.message);
                if (error.code === 'auth/email-already-in-use') {
                    showAlert('Email already registered. Please login instead.', 'error');
                } else if (error.code === 'auth/weak-password') {
                    showAlert('Password is too weak. Use at least 6 characters with letters and numbers.', 'error');
                } else if (error.code === 'auth/invalid-email') {
                    showAlert('Invalid email format.', 'error');
                } else {
                    showAlert('Signup failed: ' + error.message, 'error');
                }
            }
        }
        
        async function handleGoogleSignup() {
            showAlert('Connecting to Google...', 'info');
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                const name = user.displayName || user.email.split('@')[0];
                
                // For Google signup, show additional form to collect goal, budget, diet
                const goal = prompt("Please select your fitness goal:\n1 - Muscle Gain\n2 - Fat Loss\n3 - Lean Body\n4 - Maintenance");
                let selectedGoal = "muscle_gain";
                if (goal === "1") selectedGoal = "muscle_gain";
                else if (goal === "2") selectedGoal = "fat_loss";
                else if (goal === "3") selectedGoal = "lean_body";
                else if (goal === "4") selectedGoal = "maintenance";
                
                const budget = prompt("Please enter your weekly food budget in ₹ (min 500):", "1500");
                const dietPref = prompt("Please select your diet preference:\n1 - Vegetarian\n2 - Non-Vegetarian", "2");
                const selectedDiet = dietPref === "1" ? "veg" : "nonveg";
                
                await saveUserToFirestore(user, { 
                    name, 
                    goal: selectedGoal, 
                    budget: parseInt(budget) || 1500, 
                    dietPreference: selectedDiet 
                });
                
                // Store user in localStorage for homepage
                localStorage.setItem('firebaseUser', JSON.stringify({ 
                    email: user.email, 
                    uid: user.uid,
                    name: name
                }));
                
                localStorage.setItem('userGoal', selectedGoal);
                localStorage.setItem('userBudget', budget);
                localStorage.setItem('userDiet', selectedDiet);
                
                showAlert('Google signup successful! Redirecting...', 'success');
                
                const redirectUrl = localStorage.getItem('redirectAfterLogin');
                if (redirectUrl) {
                    localStorage.removeItem('redirectAfterLogin');
                    setTimeout(() => { window.location.href = redirectUrl; }, 1500);
                } else {
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                }
            } catch (error) {
                console.error('Google signup error:', error.code, error.message);
                if (error.code === 'auth/popup-closed-by-user') {
                    showAlert('Popup closed. Please try again.', 'error');
                } else if (error.code === 'auth/account-exists-with-different-credential') {
                    showAlert('An account already exists with the same email address.', 'error');
                } else {
                    showAlert('Google signup failed: ' + error.message, 'error');
                }
            }
        }
        
        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('User already logged in:', user.email);
                localStorage.setItem('firebaseUser', JSON.stringify({ 
                    email: user.email, 
                    uid: user.uid,
                    name: user.displayName || user.email.split('@')[0]
                }));
            }
        });
        
        function initThreeJS() {
            const canvas = document.getElementById('bgCanvas'); if(!canvas) return;
            const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 20; const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setClearColor(0x000000, 0);
            scene.add(new THREE.AmbientLight(0x0a0a0a, 0.4));
            const pL1 = new THREE.PointLight(0xff0000, 1, 50); pL1.position.set(-8, 5, 5); scene.add(pL1);
            const tkGeo = new THREE.TorusKnotGeometry(2.5, 0.35, 256, 32, 3, 5);
            const tkMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x330000 });
            const torusKnot = new THREE.Mesh(tkGeo, tkMat); scene.add(torusKnot);
            const pCount = 2000; const pGeo = new THREE.BufferGeometry(); const pPos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount; i++) { pPos[i*3]=(Math.random()-0.5)*200; pPos[i*3+1]=(Math.random()-0.5)*100; pPos[i*3+2]=(Math.random()-0.5)*100-30; }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xff0000, size: 0.05, transparent: true, opacity: 0.3 }));
            scene.add(particles);
            let time = 0;
            function animate() { requestAnimationFrame(animate); time += 0.01; torusKnot.rotation.x = time * 0.3; torusKnot.rotation.y = time * 0.2; particles.rotation.y = time * 0.02; renderer.render(scene, camera); }
            animate();
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('loaded');
            setTimeout(() => { document.getElementById('mainContent').classList.add('visible'); }, 100);
            initThreeJS();
            document.getElementById('signupForm').addEventListener('submit', handleSignup);
            document.getElementById('googleSignupBtn').addEventListener('click', handleGoogleSignup);
        });
    </script>
</body>
</html>
